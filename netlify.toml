[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://flagcdn.com https://*.flagcdn.com https://upload.wikimedia.org https://commons.wikimedia.org https://*.wikimedia.org https://*.wikipedia.org https://media.api-sports.io https://*.openstreetmap.org https://tile.openstreetmap.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://crests.football-data.org https://cdn.thesportsdb.com https://images.thesportsdb.com https://www.thesportsdb.com https://placehold.co https://www.gstatic.com https://raw.githubusercontent.com; connect-src 'self' https://api.football-data.org https://generativelanguage.googleapis.com https://api.anthropic.com https://*.openstreetmap.org https://nominatim.openstreetmap.org https://*.basemaps.cartocdn.com https://www.thesportsdb.com https://v3.football.api-sports.io https://es.wikipedia.org https://en.wikipedia.org; frame-src 'self' https://www.openstreetmap.org; worker-src blob:;"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
